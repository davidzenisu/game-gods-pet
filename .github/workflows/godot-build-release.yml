name: Godot Build / Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Build Android Debug
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Building release
          mkdir -p build
          godot --headless --install-android-build-template --export-debug "Android" build/android_debug.aab

    - name: Build Android Release
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Setting environment variables
          printf "%s" "${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$(pwd)/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_USER }}
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD }}
          
          echo Building release
          mkdir -p build
          godot --headless --install-android-build-template --export-release "Android" build/android_release.aab

    - name: Build Windows Debug
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Building Windows Debug
          mkdir -p build
          godot --headless --export-debug "Windows Desktop" build/windows_debug.exe

    - name: Build Windows Release
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Building Windows Release
          mkdir -p build
          godot --headless --export-release "Windows Desktop" build/windows_release.exe

    - name: Build Linux Debug
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Building Linux Debug
          mkdir -p build
          godot --headless --export-debug "Linux" build/linux_debug.x86_64

    - name: Build Linux Release
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Building Linux Release
          mkdir -p build
          godot --headless --export-release "Linux" build/linux_release.x86_64
    
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          build/*
      if: github.ref_type == 'tag'
