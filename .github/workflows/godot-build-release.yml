name: Godot Build / Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Prepare Build Environment and Set Game Name
      uses: devcontainers/ci@v0.3
      with:
        runCmd: |
          echo Extracting game name from project.godot
          GAME_NAME=$(grep '^config/name=' project.godot | cut -d'=' -f2 | tr -d '"' | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          echo "GAME_NAME=$GAME_NAME" >> $GITHUB_ENV
          echo "Set GAME_NAME=$GAME_NAME"
          echo Installing zip utility
          sudo apt-get update && sudo apt-get install -y zip

    - name: Build Android Release (${{ env.GAME_NAME }})
      uses: devcontainers/ci@v0.3
      env:
        GAME_NAME: ${{ env.GAME_NAME }}
      with:
        runCmd: |
          echo Setting environment variables
          printf "%s" "${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$(pwd)/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_USER }}
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD }}
          
          set -euo pipefail
          shopt -s nullglob
          echo Building Android Release
          mkdir -p build
          godot --headless --install-android-build-template --export-release "Android" build/${GAME_NAME}-android_release.aab
          echo Packaging Android Release to zip
          files=(build/${GAME_NAME}-android_release*)
          if [ ${#files[@]} -gt 0 ]; then
            zip -j build/${GAME_NAME}-android_release.zip "${files[@]}"
            rm -f "${files[@]}"
          else
            echo "No files to zip for Android Release"
          fi
        env: |
          GAME_NAME


    # Publish to Play Store
    # https://github.com/fastlane/fastlane/discussions/19869#discussioncomment-16543339
    - name: 'Authenticate to GCP'
      uses: 'google-github-actions/auth@v3'
      id: auth-gcp
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_ID }}
        create_credentials_file: true
      #if: github.ref_type == 'tag'

    - name: Build Android Debug (${{ env.GAME_NAME }})
      uses: devcontainers/ci@v0.3
      env:
        AAB_PATH: build/${{ env.GAME_NAME }}-android_release.aab
        PLAY_TRACK: internal
      with:
        runCmd: |
          sudo bundle install
          bundle exec fastlane android deploy \
            --json_key '${{ steps.auth-gcp.outputs.credentials_file_path }}'
      #if: github.ref_type == 'tag'
